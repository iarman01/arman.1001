<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo – a spatial workspace</title>
<style>
@property --hue { syntax: "<number>"; inherits: true; initial-value: 250; }
:root {
  --bg: #e8ebf7; --text: #14172b; --muted: #4d5273;
  --glass: rgba(255,255,255,.5); --glass-edge: rgba(255,255,255,.85); --shadow: rgba(40,50,110,.22);
  --chip: rgba(20,23,43,.07); --accent: #4f5bff; --accent-text: #fff; --orb: .55;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080a16; --text: #f3f4ff; --muted: #aab0d6;
    --glass: rgba(255,255,255,.09); --glass-edge: rgba(255,255,255,.28); --shadow: rgba(0,0,0,.55);
    --chip: rgba(255,255,255,.1); --accent: #8a93ff; --accent-text: #0b0d20; --orb: .5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080a16; --text: #f3f4ff; --muted: #aab0d6;
  --glass: rgba(255,255,255,.09); --glass-edge: rgba(255,255,255,.28); --shadow: rgba(0,0,0,.55);
  --chip: rgba(255,255,255,.1); --accent: #8a93ff; --accent-text: #0b0d20; --orb: .5;
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  overflow-x: hidden; transition: --hue 1.4s ease;
  --hue: 250;
}
body[data-env="forest"] { --hue: 150; }
body[data-env="ocean"] { --hue: 200; }
body[data-env="dusk"] { --hue: 250; }

/* ambient backdrop */
.sky { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: var(--orb); animation: drift 22s ease-in-out infinite alternate; }
.o1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: hsl(var(--hue) 85% 62%); }
.o2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 10vh; background: hsl(calc(var(--hue) + 50) 85% 62%); animation-duration: 28s; }
.o3 { width: 36vmax; height: 36vmax; left: 25vw; bottom: -18vmax; background: hsl(calc(var(--hue) - 45) 85% 60%); animation-duration: 25s; }
@keyframes drift { to { transform: translate3d(5vmax, 4vmax, 0) scale(1.1); } }

/* stage */
.stage { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px 120px; perspective: 1400px; }
.scene {
  width: min(1080px, 100%); transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .35s cubic-bezier(.2,.7,.2,1);
  display: grid; gap: 22px;
  grid-template-columns: 1fr 1.35fr 1fr;
  grid-template-areas: "music hero timer" "env hero tasks";
}
.win { transform-style: preserve-3d; transform: translateZ(var(--z, 0px)); min-width: 0; }
.music { grid-area: music; --z: 34px; --d: .55s; }
.hero  { grid-area: hero;  --z: 70px; --d: .15s; }
.timer { grid-area: timer; --z: 40px; --d: .7s; }
.env   { grid-area: env;   --z: 24px; --d: .85s; }
.tasks { grid-area: tasks; --z: 52px; --d: 1s; }

.glass {
  position: relative; height: 100%; padding: 24px; border-radius: 34px; overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: blur(34px) saturate(170%); backdrop-filter: blur(34px) saturate(170%);
  border: 1px solid var(--glass-edge);
  box-shadow: 0 30px 60px -20px var(--shadow), inset 0 1px 0 var(--glass-edge);
  animation: arrive 1.5s var(--d, 0s) cubic-bezier(.16,1,.3,1) both;
  transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
}
.glass::before { /* specular light that follows the pointer */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.35), transparent 60%);
}
.glass:hover { transform: translateY(-4px) scale(1.012); box-shadow: 0 44px 70px -22px var(--shadow), inset 0 1px 0 var(--glass-edge); }
.glass:hover::before { opacity: 1; }
@keyframes arrive {
  from { opacity: 0; transform: translateY(40px) scale(.9); filter: blur(18px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}

h1, h2, p { margin: 0; }
h1 { font-size: clamp(2.3rem, 5vw, 3.6rem); line-height: 1.02; letter-spacing: -.035em; font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 650; letter-spacing: -.01em; }
.lead { color: var(--muted); margin-top: 16px; line-height: 1.5; max-width: 34ch; }
.hero .glass { display: flex; flex-direction: column; justify-content: center; padding: 38px 34px; min-height: 380px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn { padding: 13px 22px; border-radius: 999px; font-weight: 600; background: var(--accent); color: var(--accent-text); transition: transform .25s, filter .25s; }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.sub { color: var(--muted); font-size: .88rem; margin-top: 4px; }

/* music */
.bars { display: flex; align-items: end; gap: 5px; height: 54px; margin: 22px 0 18px; }
.bars span { flex: 1; border-radius: 6px; background: var(--accent); transform-origin: bottom; height: 100%; animation: eq 1.1s ease-in-out infinite alternate; }
.bars span:nth-child(2) { animation-delay: -.3s; } .bars span:nth-child(3) { animation-delay: -.7s; }
.bars span:nth-child(4) { animation-delay: -.2s; } .bars span:nth-child(5) { animation-delay: -.9s; } .bars span:nth-child(6) { animation-delay: -.5s; }
.paused .bars span { animation-play-state: paused; }
@keyframes eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--chip); font-size: 1rem; transition: transform .25s, background .25s; }
.round:hover { transform: scale(1.1); background: var(--accent); color: var(--accent-text); }

/* timer */
.ring { position: relative; width: 150px; height: 150px; margin: 14px auto 16px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .track { stroke: var(--chip); }
.ring .prog { stroke: var(--accent); stroke-dasharray: 339.3; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.9rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.center { text-align: center; }

/* environments + tasks */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { padding: 10px 16px; border-radius: 999px; background: var(--chip); font-weight: 550; transition: background .3s, color .3s, transform .25s; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.chip:hover { transform: translateY(-2px); }
.list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.list button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 12px; border-radius: 16px; background: var(--chip); transition: background .25s; }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-size: .75rem; transition: all .3s; }
.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.done .t { opacity: .5; text-decoration: line-through; }

/* floating ornament */
.dock {
  position: fixed; z-index: 5; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0;
  display: flex; gap: 6px; padding: 8px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
  box-shadow: 0 20px 40px -12px var(--shadow);
  animation: rise 1.3s 1.3s cubic-bezier(.16,1,.3,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.9); } to { opacity: 1; transform: none; } }
.dock button { padding: 11px 18px; border-radius: 999px; background: transparent; font-weight: 600; font-size: .92rem; transition: background .25s; }
.dock button:hover, .dock button[aria-current="true"] { background: var(--chip); }

@media (max-width: 860px) {
  .scene { grid-template-columns: 1fr; grid-template-areas: "hero" "music" "timer" "env" "tasks"; }
  .hero .glass { min-height: 0; }
  .win { --z: 0px !important; }
}
@media (prefers-reduced-motion: reduce) {
  .glass, .dock { animation-duration: .01s; animation-delay: 0s; }
  .orb, .bars span { animation: none; }
  .scene { transition: none; }
}
</style>
</head>
<body data-env="dusk">
<div class="sky" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

<main class="stage">
  <div class="scene" id="scene">

    <section class="win hero"><div class="glass">
      <h1>Your work, hung in the room.</h1>
      <p class="lead">Halo lets you place windows around you, give each one depth, and move through them as easily as turning your head.</p>
      <div class="row">
        <button class="btn" id="enter">Enter the space</button>
        <button class="btn ghost" id="theme">Switch light or dark</button>
      </div>
    </div></section>

    <section class="win music"><div class="glass" id="music">
      <h2>Now playing</h2>
      <p class="sub">Slow Tide · Low Orbit</p>
      <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <button class="round" id="play" aria-label="Pause music">❚❚</button>
    </div></section>

    <section class="win timer"><div class="glass center">
      <h2>Focus session</h2>
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="prog" cx="60" cy="60" r="54"/></svg>
        <b id="clock">25:00</b>
      </div>
      <button class="btn" id="go">Start</button>
    </div></section>

    <section class="win env"><div class="glass">
      <h2>Environment</h2>
      <p class="sub">Change the light around you.</p>
      <div class="chips" id="envs">
        <button class="chip" data-env="dusk" aria-pressed="true">Dusk</button>
        <button class="chip" data-env="forest" aria-pressed="false">Forest</button>
        <button class="chip" data-env="ocean" aria-pressed="false">Ocean</button>
      </div>
    </div></section>

    <section class="win tasks"><div class="glass">
      <h2>Today</h2>
      <ul class="list" id="tasks">
        <li><button><span class="tick"></span><span class="t">Sketch the lobby window</span></button></li>
        <li><button class="done"><span class="tick">✓</span><span class="t">Send depth tests to Mira</span></button></li>
        <li><button><span class="tick"></span><span class="t">Review motion curves</span></button></li>
      </ul>
    </div></section>

  </div>
</main>

<nav class="dock" aria-label="Spaces">
  <button aria-current="true">Home</button><button>Windows</button><button>People</button><button>Library</button>
</nav>

<script>
(function () {
  var scene = document.getElementById('scene');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // head-tracking style tilt from pointer position
  if (!reduce) {
    addEventListener('pointermove', function (e) {
      if (innerWidth < 860) return;
      var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      scene.style.setProperty('--ry', (x * 9).toFixed(2) + 'deg');
      scene.style.setProperty('--rx', (-y * 7).toFixed(2) + 'deg');
    });
    addEventListener('pointerleave', function () {
      scene.style.setProperty('--rx', '0deg'); scene.style.setProperty('--ry', '0deg');
    });
  }
  // specular highlight
  document.querySelectorAll('.glass').forEach(function (g) {
    g.addEventListener('pointermove', function (e) {
      var r = g.getBoundingClientRect();
      g.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      g.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  // theme
  document.getElementById('theme').onclick = function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  };
  document.getElementById('enter').onclick = function () {
    scene.style.setProperty('--ry', '-6deg'); scene.style.setProperty('--rx', '3deg');
    setTimeout(function () { scene.style.setProperty('--ry', '0deg'); scene.style.setProperty('--rx', '0deg'); }, 700);
  };

  // music
  var music = document.getElementById('music'), play = document.getElementById('play');
  play.onclick = function () {
    var p = music.classList.toggle('paused');
    play.textContent = p ? '▶' : '❚❚';
    play.setAttribute('aria-label', p ? 'Play music' : 'Pause music');
  };

  // environments
  var envs = document.querySelectorAll('#envs .chip');
  envs.forEach(function (c) {
    c.onclick = function () {
      document.body.dataset.env = c.dataset.env;
      envs.forEach(function (o) { o.setAttribute('aria-pressed', o === c ? 'true' : 'false'); });
    };
  });

  // tasks
  document.querySelectorAll('#tasks button').forEach(function (b) {
    b.onclick = function () {
      var d = b.classList.toggle('done');
      b.querySelector('.tick').textContent = d ? '✓' : '';
    };
  });

  // focus timer
  var total = 1500, left = total, timer = null;
  var clock = document.getElementById('clock'), prog = document.getElementById('prog'), go = document.getElementById('go');
  function draw() {
    var m = Math.floor(left / 60), s = left % 60;
    clock.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    prog.style.strokeDashoffset = (339.3 * (1 - left / total)).toFixed(1);
  }
  go.onclick = function () {
    if (timer) { clearInterval(timer); timer = null; go.textContent = 'Resume'; return; }
    go.textContent = 'Pause';
    timer = setInterval(function () {
      left--; draw();
      if (left <= 0) { clearInterval(timer); timer = null; left = total; go.textContent = 'Start'; draw(); }
    }, 1000);
  };
  draw();
})();
</script>
</body>
</html>
